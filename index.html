<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>A-Frame Space Planets</title>
    <script src="https://aframe.io/releases/1.6.0/aframe.min.js"></script>
    <script>
      AFRAME.registerComponent("fit-model", {
        schema: { size: { default: 1.5 } },
        init: function () {
          var el = this.el;
          var targetSize = this.data.size;
          el.addEventListener("model-loaded", function () {
            setTimeout(function() {
              var mesh = el.getObject3D("mesh");
              if (!mesh) return;
              mesh.updateWorldMatrix(true, true);
              var box = new THREE.Box3().setFromObject(mesh);
              var s = box.getSize(new THREE.Vector3());
              var maxDim = Math.max(s.x, s.y, s.z);
              if (maxDim > 0) {
                var sc = targetSize / maxDim;
                el.object3D.scale.set(sc, sc, sc);
              }
            }, 100);
          });
        }
      });

      AFRAME.registerComponent("starfield", {
        init: function () {
          var group = document.createElement("a-entity");
          for (var i = 0; i < 500; i++) {
            var star = document.createElement("a-sphere");
            var radius = 70;
            var phi = Math.random() * Math.PI * 2;
            var costheta = Math.random() * 2 - 1;
            var theta = Math.acos(costheta);
            var x = radius * Math.sin(theta) * Math.cos(phi);
            var y = radius * Math.sin(theta) * Math.sin(phi);
            var z = radius * Math.cos(theta);
            star.setAttribute("position", x + " " + y + " " + z);
            star.setAttribute("radius", 0.06 + Math.random() * 0.06);
            star.setAttribute("color", "#F9FCBB");
            star.setAttribute("material", "shader: flat; emissive: #ffffff; emissiveIntensity: 1;");
            group.appendChild(star);
          }
          this.el.appendChild(group);
        }
      });
    </script>
    <style>
      html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; background: #020617; }
    </style>
  </head>
  <body>
    <a-scene background="color: #020617" renderer="colorManagement: true">
      <a-entity starfield></a-entity>

      <a-entity light="type: ambient; color: #ffffff; intensity: 1.0"></a-entity>
      <a-entity light="type: directional; color: #ffffff; intensity: 1.5" position="2 4 3"></a-entity>
      <a-entity light="type: point; color: #ffffff; intensity: 2.0; distance: 20" position="0 3 -2"></a-entity>

      <a-entity id="camera-rig" position="0 1.6 0">
        <a-camera position="0 0 0"></a-camera>

        <a-entity rotation="14 0 0" animation="property: rotation; to: 0 360 360; loop: true; dur: 7000; easing: linear;">
          <a-entity
            gltf-model="model.glb"
            position="4.2 -0.1 0"
            fit-model="size: 0.52"
            animation="property: rotation; to: 0 360 0; loop: true; dur: 3000; easing: linear;">
          </a-entity>
        </a-entity>

        <a-entity rotation="-10 0 0" animation="property: rotation; to: 0 360 0; loop: true; dur: 10200; easing: linear;">
          <a-entity
            gltf-model="model.glb"
            position="3.7 0.35 0"
            fit-model="size: 0.36"
            animation="property: rotation; to: 0 360 0; loop: true; dur: 3800; easing: linear;">
          </a-entity>
        </a-entity>
      </a-entity>

      <a-entity
        gltf-model="model.glb"
        position="0 1.6 -3"
        fit-model="size: 2.25"
        animation="property: rotation; to: 0 360 0; loop: true; dur: 4000; easing: linear;">
      </a-entity>
    </a-scene>
  </body>
</html>
